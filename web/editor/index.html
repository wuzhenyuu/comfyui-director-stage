<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D导演台 M2</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #171a22;
      --border: #2a2f3d;
      --text: #e6e9f0;
      --muted: #8a90a0;
      --accent: #2f9e63;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #topbar {
      height: 50px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    #title { font-size: 15px; font-weight: 600; white-space: nowrap; }
    button {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      background: #232836;
      transition: filter 0.15s;
      white-space: nowrap;
    }
    button:hover { filter: brightness(1.2); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #btnApply { background: var(--accent); border-color: #37b573; }
    #hint { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }

    /* ── 主区域 flex 布局 ── */
    #main-area {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── 左侧边栏 ── */
    #sidebar {
      width: 230px;
      flex: 0 0 auto;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-tab {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: background 0.15s;
    }
    .sidebar-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .sidebar-tab:hover {
      background: #232836;
      filter: none;
    }

    #sidebar-panels {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .sidebar-panel {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      display: none;
      flex-direction: column;
    }
    .sidebar-panel.active {
      display: flex;
    }

    /* ── 视口 ── */
    #viewport {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      position: relative;
    }
    #viewport canvas { display: block; }

    /* ── Toast ── */
    #m2-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* ── 相机面板 ── */
    .cam-item {
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .cam-item.active-cam {
      background: #2f9e6340;
    }
    .cam-item:hover { background: #232836; }

    .cam-actions {
      padding: 4px 10px;
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
    }
  </style>
  <script type="module" crossorigin src="./assets/index-D_2mlPCa.js"></script>
</head>
<body>
  <div id="topbar">
    <span id="title">🎬 3D导演台 M2</span>
    <button id="btnApply">✅ 应用到节点</button>
    <button id="btnCancel">❌ 取消</button>
    <span id="hint">左键选关节拖动 / 右键旋转视角 / 滚轮缩放</span>
    <span id="status"></span>
  </div>
  <div id="main-area">
    <div id="sidebar">
      <div id="sidebar-tabs">
        <button class="sidebar-tab active" data-panel="char-panel">🎭 角色</button>
        <button class="sidebar-tab" data-panel="camera-panel">📷 机位</button>
        <button class="sidebar-tab" data-panel="props-panel">🧱 道具</button>
        <button class="sidebar-tab" data-panel="char-props-panel">🪪 属性</button>
        <button class="sidebar-tab" data-panel="scene-settings-panel">⚙️ 场景</button>
        <button class="sidebar-tab" data-panel="model-library-panel">📦 模型</button>
      </div>
      <div id="sidebar-panels">
        <div class="sidebar-panel active" id="char-panel"></div>
        <div class="sidebar-panel" id="camera-panel"></div>
        <div class="sidebar-panel" id="props-panel"></div>
        <div class="sidebar-panel" id="char-props-panel"></div>
        <div class="sidebar-panel" id="scene-settings-panel"></div>
        <div class="sidebar-panel" id="model-library-panel"></div>
      </div>
    </div>
    <div id="viewport"></div>
  </div>
</body>
</html>
